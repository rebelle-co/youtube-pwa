<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Playlist Hors-ligne - YouTube Premium Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
      display: flex;
      gap: 20px;
    }
    .player-container {
      flex: 2;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
    }
    .video-info {
      padding: 15px;
      background-color: #161616;
    }
    .sidebar {
      flex: 1;
      background-color: #161616;
      border-radius: 8px;
      padding: 15px;
      max-height: 85vh;
      overflow-y: auto;
    }
    h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px;}
    .video-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #212121;
      margin-bottom: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .video-item:hover { background-color: #303030; }
    .video-title { font-weight: bold; font-size: 14px; }
    .delete-btn {
      background-color: #ff0000;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .no-video { text-align: center; color: #aaa; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- Zone du Lecteur Vidéo principal -->
  <div class="player-container">
    <video id="mainPlayer" controls autoplay></video>
    <div class="video-info">
      <h3 id="playingTitle">Sélectionnez une vidéo pour démarrer la lecture</h3>
    </div>
  </div>

  <!-- Liste latérale des vidéos téléchargées -->
  <div class="sidebar">
    <h2>Ma Playlist local</h2>
    <div id="videosList">
      <div class="no-video">Aucune vidéo téléchargée pour le moment.</div>
    </div>
  </div>

  <script src="playlist.js"></script>
</body>
</html>
